# Shared by every service that runs the Laravel API image (application, queue,
# scheduler). Values come from the Dokploy Environment tab (.env at deploy time).
x-api-env: &api-env
  APP_KEY: ${APP_KEY:?APP_KEY is not set - add it in the Dokploy Environment tab}
  APP_URL: ${APP_URL:-http://localhost:39904}
  CONSOLE_HOST: ${CONSOLE_HOST:-http://localhost:39903}
  FRONTEND_HOSTS: ${FRONTEND_HOSTS:-http://localhost:39903}
  DATABASE_URL: "mysql://root@database/fleetbase"
  QUEUE_CONNECTION: redis
  CACHE_DRIVER: redis
  CACHE_PATH: /fleetbase/api/storage/framework/cache
  CACHE_URL: tcp://cache
  REDIS_URL: tcp://cache

services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    # Binary logging is on by default in MySQL 8 with a 30-day expiry. Nothing
    # here replicates from or reads the binlog, and the telematics ingest made it
    # grow past 300 GB locally, so it is switched off.
    command: ["mysqld", "--skip-log-bin"]
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "mysql-data:/var/lib/mysql"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "39905:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10
      # For production, set SOCKETCLUSTER_ORIGINS to e.g. https://yourdomain.com:*
      SOCKETCLUSTER_OPTIONS: '{"origins":"${SOCKETCLUSTER_ORIGINS:-http://localhost:*}"}'

  scheduler:
    image: fleetbase/fleetbase-api:latest
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      - database
      - cache

  queue:
    image: fleetbase/fleetbase-api:latest
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: *api-env
    depends_on:
      - database
      - cache

  console:
    restart: unless-stopped
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    ports:
      - "39903:4200"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json

  application:
    restart: unless-stopped
    image: fleetbase/fleetbase-api:latest
    volumes:
      - "api-storage:/fleetbase/api/storage/app"
    environment:
      <<: *api-env
      ENVIRONMENT: development
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Fleetbase
      APP_NAME: Fleetbase
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
    depends_on:
      - database
      - cache
      - queue

  httpd:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "39904:80"
    depends_on:
      - application

volumes:
  mysql-data:
  api-storage:

